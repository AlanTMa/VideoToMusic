
# docker-compose.prod.yml

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: silentvideosynth-backend-prod
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - backend_uploads:/app/uploads
      - backend_outputs:/app/outputs
      - backend_logs:/app/logs
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - ALLOWED_ORIGINS=https://yourdomain.com
      - MODEL_DIR=/app/models
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - LOG_LEVEL=WARNING
      - REDIS_URL=redis://redis:6379
    networks:
      - silentvideosynth
    depends_on:
      - redis
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: silentvideosynth-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=https://api.yourdomain.com
      - NEXT_PUBLIC_WS_URL=wss://api.yourdomain.com
      - NODE_ENV=production
    networks:
      - silentvideosynth
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: silentvideosynth-redis-prod
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - silentvideosynth
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    image: postgres:15-alpine
    container_name: silentvideosynth-db-prod
    environment:
      - POSTGRES_DB=silentvideosynth
      - POSTGRES_USER=silentvideosynth
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - silentvideosynth
    restart: unless-stopped
    secrets:
      - db_password
    deploy:
      resources:
        limits:
          memory: 2G

  nginx:
    image: nginx:alpine
    container_name: silentvideosynth-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - silentvideosynth
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  monitoring:
    image: prom/prometheus:latest
    container_name: silentvideosynth-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - silentvideosynth
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_outputs:
  backend_logs:
  redis_data:
  postgres_data:
  nginx_logs:
  prometheus_data:

networks:
  silentvideosynth:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt

